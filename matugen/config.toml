[config]
version_check = false
fallback_color = "#ffbf9b"
prefer = "darkness"
caching = true
source_color_index = 0

[config.wallpaper]
set = true
# Set wallpaper through awww (your autostart wallpaper backend)
command = "awww img -o eDP-1 {{ image }}"

[templates.waybar]
input_path = "./templates/waybar.css"
output_path = "/home/laliguras/.config/waybar/style.css"
index = 1
type = "SchemeTonalSpot"
# Reload waybar after regenerating its CSS
post_hook = "pkill -SIGUSR2 waybar || true"

[templates.hyprcolors]
input_path = "./templates/matugen-colors.lua"
output_path = "/home/laliguras/.config/hypr/matugen-colors.lua"
index = 1
type = "SchemeTonalSpot"
# Apply border colors live: reload Hyprland so it re-reads the generated snippet
post_hook = "hyprctl reload &"
