# Rosé Pine theme for kitty
# https://rosepinetheme.com

include ./rosepine.conf

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
font_size 11.0

window_padding_width 8
window_border_width 2
draw_minimal_borders yes
hide_window_decorations titlebar-and-corners
confirm_os_window_close 0

cursor_blink_interval 0.6
cursor_shape block

tab_bar_edge bottom

# Rosé Pine colors
background #191724
foreground #e0def4
cursor #e0def4
selection_background #403d52
selection_foreground #e0def4

# black
color0  #191724
color8  #403d52
# red
color1  #eb6f92
color9  #eb6f92
# green
color2  #31748f
color10 #9ccfd8
# yellow
color3  #f6c177
color11 #f6c177
# blue
color4  #c4a7e7
color12 #c4a7e7
# magenta
color5  #c4a7e7
color13 #c4a7e7
# cyan
color6  #9ccfd8
color14 #9ccfd8
# white
color7  #e0def4
color15 #e0def4
